<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Registration | NIET</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", Arial, sans-serif; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff; width: 100%; max-width: 460px;
    border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.3);
    overflow: hidden;
  }
  .header {
    background: #1e3c72; color: #fff; text-align: center; padding: 24px 20px;
  }
  .header h1 { font-size: 20px; margin-bottom: 6px; }
  .header p { font-size: 14px; opacity: .85; }
  form { padding: 26px; }
  label { display: block; font-size: 14px; font-weight: 600; color: #333; margin-bottom: 5px; }
  input {
    width: 100%; padding: 11px 12px; margin-bottom: 18px;
    border: 1.5px solid #ccd3e0; border-radius: 8px; font-size: 15px;
  }
  input:focus { outline: none; border-color: #2a5298; box-shadow: 0 0 0 3px rgba(42,82,152,.2); }
  button {
    width: 100%; padding: 12px; border: none; border-radius: 8px;
    background: #2a5298; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #1e3c72; }
  .footer { text-align: center; font-size: 12px; color: #777; padding-bottom: 18px; }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>Noida Institute of Engineering and Technology</h1>
      <p>B.Tech CSE (Data Science)</p>
    </div>
    <form method="post" action="/submit">
      <label for="name">Student Name</label>
      <input id="name" name="name" type="text" placeholder="Enter full name" required>

      <label for="roll">Roll Number</label>
      <input id="roll" name="roll" type="text" placeholder="Enter roll number" required>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="Enter email address" required>

      <label for="course">Course</label>
      <input id="course" name="course" type="text" value="B.Tech CSE (Data Science)" required>

      <button type="submit">Submit</button>
    </form>
    <div class="footer">Student Registration Portal</div>
  </div>
</body>
</html>
